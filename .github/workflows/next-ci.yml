name: HELP-ME application verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: helpme
          POSTGRES_PASSWORD: helpme_test_password
          POSTGRES_DB: helpme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpme -d helpme_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: 'postgresql://helpme:helpme_test_password@localhost:5432/helpme_test?schema=public'
      - name: Apply migrations to disposable PostgreSQL
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: 'postgresql://helpme:helpme_test_password@localhost:5432/helpme_test?schema=public'
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: 'postgresql://helpme:helpme_test_password@localhost:5432/helpme_test?schema=public'
